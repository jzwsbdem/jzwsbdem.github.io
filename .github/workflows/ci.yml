name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - '.parcelrc'
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - '.parcelrc'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: webpage
          build_dir: dist
          fqdn: https://republic-of-narcissus.icu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
