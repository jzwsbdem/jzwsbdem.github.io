<!DOCTYPE html>
<html lang="en">

<head>
    <!-- ===== 竖屏CSS（手机竖屏） ===== -->
    <link rel="stylesheet" href="../../styles/ObserverSpiritMobile.css" media="(max-aspect-ratio: 1/1)">
    
    <!-- ===== 横屏CSS（电脑/横屏） ===== -->
    <link rel="stylesheet" href="../../styles/ObserverSpiritDesktop.css" media="(min-aspect-ratio: 1/1)">

    <link rel="stylesheet" type="text/css" href="../../styles/Font.css"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yin's Observer Spirit</title>
</head>

<body>
    <div class="musTitle1">Yin's Observer Spirit</div>
    <div class="musTitle2">PSYCHEDELIC ENCODER</div>
    <div class="progress-track">
        <div class="progress-fill"></div>
    </div>
    <div class="musicPlayerFrame">
        <div class="frameProtocal">
            <div class="protocalText">PROTOCAL</div>
        </div>
        <div class="frameInformation">
            <div class="informationText">INFORMATION</div>
            <div class="nameText1">KIRSI (YIN)</div>
            <div class="nameText2">A DOLL...</div>
            <div class="nameText3">&nbsp</div>
            <div class="nameText4">BIRTHDAY</div>
            <div class="nameText5">DECEMBER 21</div>
        </div>
        <div class="frameInf1">
            <div class="inf1Text">Observable Signal Strength</div>
        </div>
        <div class="frameInf2">
            <div class="inf2Text1">NEXT RESET</div>
            <div class="inf2Text2">TIME LEFT</div>
            <div class="inf2Text3">00:00:00</div>
        </div>
        <div class="frameMusic">
            <div class="player">
            <span class="status-text">PLAYING</span>
            <div class="now-playing" id="nowPlayingLabel"></div>
            <div class="custom-audio">
                <button class="play-btn" id="playBtn" aria-label="播放/暂停">▶</button>
                <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
                </div>
                <div class="volume-container">
                <span class="volume-icon" id="volumeIcon">🔊</span>
                <div class="volume-bar" id="volumeBar">
                    <div class="volume-fill" id="volumeFill"></div>
                </div>
                </div>
            </div>
            <div class="track-list" id="trackListContainer"></div>
            <audio id="audioPlayer" preload="metadata"></audio>
            <div id="errorDisplay" class="error-msg"></div>
            </div>
        </div>
        <div id="frameSystemConsole">
            <div class="systemConsoleText">SYSTEM CONSOLE</div>
            <div class="frameSystemConsoleInner">
                <div id="logOutput"></div>
            </div>
            <div id="frameSmile">
                <div class="smileText">SMILE !</div>
            </div>
        </div>
        <div class="frameWorldClock">
            <div class="worldClockText">WORLD CLOCK</div>
            <div class="frameWorldClockInnerLeft">
                <div class="clockLeftName">CHINA</div>
                <div id="clockChina"></div>
                <div id="dateChina"></div>
            </div>
            <div class="frameWorldClockInnerRight">
                <div class="clockRightName">FINLAND</div>
                <div id="clockFinland"></div>
                <div id="dateFinland"></div>
            </div>
        </div>
        <div class="frameCalendar"></div>
        <div id="frameCharacter">
            <div class="characterText">I AM KIRSI...</div>
            <div id="frameCube">
                <div class="calculateText">...</div>
            </div>
            <div id="frameMemory"></div>
            <div id="frameAvatar">
                <div class="avatarText">AVATAR</div>
            </div>
            <div id="frameSecretCode">
                <div class="secretCodeText">SECRET CODE</div>
            </div>
        </div>

    </div>
    <script src="../../scripts/Adaptation.js"></script>
    <script src="../../scripts/MoveableFrame.js"></script>
    <script src="../../scripts/ObserverSpirit/MusicPlayerOS.js"></script>
    <script src="../../scripts/ObserverSpirit/SystemConsoleOS.js"></script>
    <script src="../../scripts/ObserverSpirit/WorldClockOS.js"></script>
</body>
</html>
